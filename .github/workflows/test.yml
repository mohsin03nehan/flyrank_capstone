name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-tailor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resume-tailor/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      # E2E tests call the live AI route and require GOOGLE_GENERATIVE_AI_API_KEY,
      # so they are run locally rather than in CI.